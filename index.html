<!DOCTYPE html>
<html lang="ko"
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍞 빵 영양성분</title>
<style>

body{
margin:0;
font-family:'Pretendard',sans-serif;
background:linear-gradient(#f9f4ef,#efe2d3);
}

header{
text-align:center;
font-size:28px;
font-weight:bold;
padding:20px;
}

.container{
max-width:720px;
margin:auto;
padding:15px;
}

.card{
background:white;
padding:16px;
margin-bottom:12px;
border-radius:14px;
box-shadow:0 5px 12px rgba(0,0,0,0.08);
cursor:pointer;
transition:0.2s;
}

.card:hover{
transform:translateY(-3px);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.search{
width:100%;
padding:10px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #ddd;
font-size:15px;
}

.detail{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 12px rgba(0,0,0,0.08);
}

.back{
margin-bottom:15px;
background:#ffb84d;
border:none;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
}

.category{
background:#fff3e0;
padding:10px;
border-radius:10px;
text-align:center;
font-weight:500;
}

</style>
</head>
<body>

<header>🍞 빵 영양성분 사전</header>
<div class="container" id="app"></div>
<script>

const bakeries = {

"파리바게뜨":{

"식빵":[
{
name:"우유식빵",
amount:"100g",
kcal:"210kcal",
sodium:"260mg",
sugar:"7g",
fat:"3g",
protein:"7g",
allergy:"밀, 우유"
}
],

"간식빵":[
{
name:"소보로빵",
amount:"85g",
kcal:"310kcal",
sodium:"280mg",
sugar:"12g",
fat:"10g",
protein:"6g",
allergy:"밀, 우유, 계란"
}
],

"건강빵":[
{
name:"호밀빵",
amount:"90g",
kcal:"190kcal",
sodium:"200mg",
sugar:"3g",
fat:"2g",
protein:"6g",
allergy:"밀"
}
],

"도넛":[
{
name:"슈가도넛",
amount:"75g",
kcal:"320kcal",
sodium:"250mg",
sugar:"15g",
fat:"12g",
protein:"5g",
allergy:"밀, 우유, 계란"
}
],

"페스츄리":[
{
name:"프렌치 크라상",
amount:"70g",
kcal:"240kcal",
sodium:"230mg",
sugar:"6g",
fat:"8g",
protein:"5g",
allergy:"밀, 우유, 계란"
}
]

},

"뚜레쥬르":{

"식빵":[
{
name:"우유식빵",
amount:"100g",
kcal:"210kcal",
sodium:"250mg",
sugar:"7g",
fat:"3g",
protein:"7g",
allergy:"밀, 우유"
}
],

"간식빵":[
{
name:"단팥빵",
amount:"90g",
kcal:"300kcal",
sodium:"270mg",
sugar:"13g",
fat:"8g",
protein:"6g",
allergy:"밀, 우유"
}
],

"건강빵":[
{
name:"통밀빵",
amount:"95g",
kcal:"200kcal",
sodium:"210mg",
sugar:"4g",
fat:"3g",
protein:"7g",
allergy:"밀"
}
],

"도넛":[
{
name:"초코도넛",
amount:"80g",
kcal:"330kcal",
sodium:"260mg",
sugar:"16g",
fat:"14g",
protein:"5g",
allergy:"밀, 우유, 계란"
}
],

"페스츄리":[
{
name:"버터크라상",
amount:"70g",
kcal:"250kcal",
sodium:"230mg",
sugar:"6g",
fat:"9g",
protein:"5g",
allergy:"밀, 우유, 계란"
}
]

}

};

let currentBakery=null;
let currentCategory=null;

function showBakeries(){

const app=document.getElementById("app");

app.innerHTML="";

Object.keys(bakeries).forEach(b=>{

const div=document.createElement("div");

div.className="card";

div.innerText=b;

div.onclick=()=>showCategories(b);

app.appendChild(div);

});

}

function showCategories(bakery){

currentBakery=bakery;

const app=document.getElementById("app");

app.innerHTML=`
<button class="back" onclick="showBakeries()">← 뒤로</button>
<div class="grid" id="cat"></div>
`;

const cat=document.getElementById("cat");

Object.keys(bakeries[bakery]).forEach(c=>{

const div=document.createElement("div");

div.className="category";

div.innerText=c;

div.onclick=()=>showBreads(c);

cat.appendChild(div);

});

}

function showBreads(category){

currentCategory=category;

const app=document.getElementById("app");

app.innerHTML=`
<button class="back" onclick="showCategories('${currentBakery}')">← 뒤로</button>
<input class="search" placeholder="빵 검색" oninput="searchBread(this.value)">
<div id="breadList"></div>
`;

renderBreadList(bakeries[currentBakery][category]);

}

function renderBreadList(list){

const breadList=document.getElementById("breadList");

breadList.innerHTML="";

list.forEach(b=>{

const div=document.createElement("div");

div.className="card";

div.innerText=b.name;

div.onclick=()=>showDetail(b);

breadList.appendChild(div);

});

}

function searchBread(text){

const list=bakeries[currentBakery][currentCategory].filter(b=>
b.name.includes(text)
);

renderBreadList(list);

}

function showDetail(b){

const app=document.getElementById("app");

app.innerHTML=`

<button class="back" onclick="showBreads('${currentCategory}')">← 뒤로</button>

<div class="detail">

<h2>${b.name}</h2>

<p><b>내용량</b> : ${b.amount}</p>
<p><b>칼로리</b> : ${b.kcal}</p>
<p><b>나트륨</b> : ${b.sodium}</p>
<p><b>당류</b> : ${b.sugar}</p>
<p><b>포화지방</b> : ${b.fat}</p>
<p><b>단백질</b> : ${b.protein}</p>
<p><b>알레르기 정보</b> : ${b.allergy}</p>

</div>
`;

}

showBakeries();

</script>
</body>
</html>
