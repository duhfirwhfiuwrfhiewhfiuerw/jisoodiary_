<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍞 빵집별 영양성분표</title>

<style>

body{
font-family:sans-serif;
margin:0;
background:linear-gradient(#fff8f0,#f1e2d2);
}

header{
text-align:center;
padding:20px;
font-size:28px;
font-weight:bold;
}

.controls{
display:flex;
gap:10px;
justify-content:center;
flex-wrap:wrap;
margin-bottom:20px;
}

select,input{
padding:10px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

.container{
max-width:700px;
margin:auto;
padding:10px;
}

.card{
background:white;
padding:15px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card img{
width:100%;
border-radius:10px;
margin-bottom:10px;
}

.favorite{
cursor:pointer;
float:right;
font-size:22px;
}

.nutrition{
font-size:14px;
color:#444;
margin-top:5px;
}

.addBox{
max-width:700px;
margin:auto;
padding:20px;
background:white;
border-radius:15px;
margin-top:30px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.addBox input{
width:100%;
margin-bottom:10px;
}

.card img{
width:100%;
height:200px;
object-fit:cover;
border-radius:10px;
margin-bottom:10px;
}

button{
padding:10px;
border:none;
border-radius:10px;
background:#ffb84d;
font-size:16px;
cursor:pointer;
}

</style>
</head>

<body>

<header>🍞 빵집별 영양성분표</header>

<div class="controls">

<select id="bakerySelect" onchange="renderList()">
<option value="전체">전체 빵집</option>
<option value="파리바게뜨">파리바게뜨</option>
<option value="뚜레쥬르">뚜레쥬르</option>
<option value="개인베이커리">개인베이커리</option>
<option value="내가추가">내가추가</option>
</select>

<input
type="text"
placeholder="빵 검색 🔍"
id="searchInput"
oninput="renderList()"
/>

</div>

<div class="container" id="breadList"></div>

<div class="addBox">

<h3>➕ 빵 추가</h3>

<input id="newName" placeholder="빵 이름">

<input id="newImage" placeholder="빵 사진 URL">

<input id="newKcal" placeholder="칼로리">

<input id="newCarb" placeholder="탄수화물">

<input id="newProtein" placeholder="단백질">

<input id="newFat" placeholder="지방">

<button onclick="addBread()">추가하기</button>

</div>

<script>

const breads = [

{
bakery:"파리바게뜨",
name:"크루아상",image:"https://images.unsplash.com/photo-1555507036-ab794f57584a",
kcal:270,
carb:30,
protein:6,
fat:14,
sugar:5,
sodium:220
},

{
bakery:"뚜레쥬르",
name:"우유식빵",
image:"https://images.unsplash.com/photo-1608198093002-ad4e005484ec",
kcal:210,
carb:38,
protein:7,
fat:4,
sugar:6,
sodium:250
},

{
bakery:"개인베이커리",
name:"마카롱",
image:"https://images.unsplash.com/photo-1569864358642-9d1684040f43",
kcal:150,
carb:18,
protein:3,
fat:7,
sugar:14,
sodium:40
}

];

let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

function renderList(){

const bakery = document.getElementById("bakerySelect").value;
const search = document.getElementById("searchInput").value.toLowerCase();
const list = document.getElementById("breadList");

list.innerHTML="";

breads
.filter(b => bakery==="전체" || b.bakery===bakery)
.filter(b => b.name.toLowerCase().includes(search))
.forEach(b=>{

const fav = favorites.includes(b.name) ? "⭐" : "☆";

const div = document.createElement("div");

div.className="card";

div.innerHTML=`

<span class="favorite" onclick="toggleFavorite('${b.name}')">${fav}</span>

<img src="${b.image}">

<h3>${b.name}</h3>

<div>${b.bakery}</div>

<div><b>${b.kcal} kcal</b></div>

<div class="nutrition">
탄수화물 ${b.carb}g |
단백질 ${b.protein}g |
지방 ${b.fat}g
</div>

`;

list.appendChild(div);

});

}

function toggleFavorite(name){

if(favorites.includes(name)){
favorites = favorites.filter(f => f!==name);
}else{
favorites.push(name);
}

localStorage.setItem("favorites", JSON.stringify(favorites));

renderList();

}

function addBread(){

const name = document.getElementById("newName").value;
const image = document.getElementById("newImage").value;
const kcal = document.getElementById("newKcal").value;
const carb = document.getElementById("newCarb").value;
const protein = document.getElementById("newProtein").value;
const fat = document.getElementById("newFat").value;

breads.push({
bakery:"내가추가",
name:name,
image:image,
kcal:kcal,
carb:carb,
protein:protein,
fat:fat,
sugar:0,
sodium:0
});

renderList();

}

renderList();

</script>

</body>
</html>
