<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>지수 일기</title>
    <link href="https://cdn.projectnoonnu.co.kr/projectnoonnu/noonfonts_2107@1.1/DungGeunMo.css" rel="stylesheet">
    <style>
        body { margin: 0; background: #fff3f6; font-family: 'DungGeunMo', monospace; display: flex; flex-direction: column; align-items: center; padding: 10px 0; touch-action: manipulation; overflow-x: hidden; }
        canvas { width: 95%; max-width: 500px; background: #fdf6f0; border: 3px solid #e8cfcf; image-rendering: pixelated; border-radius: 10px; cursor: pointer; display: block; }
        
        #textBox {
            width: 95%; max-width: 500px; height: 130px; margin-top: 15px; padding: 15px;
            background: linear-gradient(135deg, #ffffff 0%, #fff5f7 100%);
            border: 4px solid #e8cfcf; box-shadow: inset 0 0 0 2px #ffffff, 5px 5px 0px rgba(232, 207, 207, 0.5);
            border-radius: 15px; box-sizing: border-box; line-height: 1.6; color: #5a4f4f; font-size: 15px; 
            overflow-y: auto; word-break: keep-all; position: relative;
            scrollbar-width: thin; scrollbar-color: #ffb6c1 transparent;
            scroll-behavior: smooth;
        }
        
        #textBox::-webkit-scrollbar { width: 6px; }
        #textBox::-webkit-scrollbar-thumb { background-color: #ffb6c1; border-radius: 10px; }

        #loadingOverlay {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 200px; background: rgba(255, 255, 255, 0.9); padding: 15px; border: 3px solid #ffb6c1;
            border-radius: 10px; text-align: center; z-index: 10;
        }
        #progressBar { width: 0%; height: 15px; background: #ffb6c1; margin-top: 10px; border-radius: 5px; transition: width 0.1s linear; }

        .music-player { margin-top: 10px; width: 95%; max-width: 500px; text-align: center; }
        .music-label { font-size: 12px; color: #e8cfcf; margin-bottom: 5px; }
        #yt-player { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

<div style="position: relative; width: 95%; max-width: 500px;">
    <canvas id="game"></canvas>
    <div id="loadingOverlay">
        <div id="loadingText" style="font-size: 14px; color: #5a4f4f;">오빠한테 달려가는 중...</div>
        <div style="width: 100%; background: #eee; border-radius: 5px; margin-top: 5px;">
            <div id="progressBar"></div>
        </div>
    </div>
</div>

<div id="textBox"></div>

<div class="music-player">
    <div class="music-label">Now Playing: 동물의 숲 브금 🍃</div>
    <iframe id="yt-player"
        src="https://www.youtube.com/embed/GYediWu_ixw?autoplay=1&loop=1&playlist=GYediWu_ixw&enablejsapi=1" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
    </iframe>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 500; canvas.height = 500;

let currentMap = "room";
let isTransitioning = false; 

const messages = {
    welcome: "지수의 방에 온걸 환영해! 가구를 클릭하거나 문으로 이동해봐 💗",
    tv: "어렸을때 티비를 자주봤어. 만화 위주로 봤었던 것같은데 요즘은 잘 안봐",
    bed: "중요한 날이니까 일찍 일어나야해! 알람맞춰놓고 열차시간 맞춰서 일어났어",
    table: "화장 다 하고 버스기다릴때 앉아있어야지 오빠한테 카톡보내놔야겠다",
    bath: "여긴 내가 화장하는 곳이야 따로 화장대가 없어서 여기서 자주 치장해. 얼른 준비해야지!",
    closet: "이건 옷장이야. 중요한 날에는 무슨옷을 입어야 잘보일지 고민을 많이해서 지각한적이 있어",
    kitchen: "오빠한테 도시락을 만들어줘야해 하지만 한번에 성공한적이 없어",
    bench: "조금 일찍 도착했으니까 여기서 열차를 기다릴수 있어",
    train_body: "내가 타야하는 열차야! 일찍 도착했으니까 빨리타서 안에서 기다리자. 열차에 투명부분을 눌러봐!",
    seat: "좌석을 찾았어! 이제 오빠 만나러 가보자! 🚂",
    parking_msg: "드디어 수서역 도착! 오빠가 주차장에서 기다리고 있을 거야 🚗",
    hint_srt: "내 자리가 어디였지? 오른쪽 상단이었던 것 같은데... 🤔",
    oppa_talk: "리트리버 닮은 사람 보이지? 이 사람이 바로 우리 오빠야!! 우린 장거리 연애를 하고있어서 항상 한달에 한두번씩 보지만 많이 애틋하고 좋아하는 사이야 ❤️",
    car_msg: "이제 차를 타보자!",
    car_inside_welcome: "주차장에 주차해서 도시락을 먹으러왔어! 도시락이랑 형균을 클릭해보고, 다 먹었으면 맨 왼쪽을 클릭해줘!",
    car_oppa: "오빠가 도시락을 와구와구 먹는 모습이 너무 귀엽다.. 다음에도 만들어주고싶다! ❤️",
    car_lunchbox: "도시락이 처음 가져왔던 거랑 비교해보면 모양이 망가져이따... 마음이 아프다 🍱"
};

const mapData = {
    room: {
        bg: "https://i.imgur.com/bMfMr3n.png",
        objects: [
            { name: 'closet', x: 30, y: 100, w: 80, h: 100, img: "https://i.imgur.com/GMdqkYn.png" }, 
            { name: 'bed', x: 190, y: 100, w: 120, h: 90, img: "https://i.imgur.com/gxjbbIY.png" },
            { name: 'tv', x: 380, y: 100, w: 90, h: 80, img: "https://i.imgur.com/x95Hwnw.png" },
            { name: 'kitchen', x: 30, y: 340, w: 120, h: 90, img: "https://i.imgur.com/86AUFui.png" },
            { name: 'table', x: 200, y: 350, w: 100, h: 80, img: "https://i.imgur.com/EnAb1YP.png" },
            { name: 'bath', x: 380, y: 340, w: 90, h: 90, img: "https://i.imgur.com/viVc6C0.png" }
        ],
        npcs: [],
        door: { x: 450, y: 150, w: 50, h: 200, target: "station" }, // 문 위치 조정
        bounds: { minX: 20, maxX: 480, minY: 150, maxY: 450 }
    },
    station: {
        bg: "https://i.imgur.com/GvvmB4e.jpeg",
        objects: [
            { name: 'bench', x: 140, y: 340, w: 180, h: 110, img: "https://i.imgur.com/LM0zkps.png" }, 
            { name: 'train_body', x: 120, y: 200, w: 320, h: 220, img: "https://i.imgur.com/P0iVk3l.png" } 
        ],
        npcs: [],
        door: { x: 300, y: 220, w: 120, h: 100, target: "srt_inside" },
        bounds: { minX: 30, maxX: 470, minY: 320, maxY: 460 }
    },
    srt_inside: {
        bg: "https://i.imgur.com/ivq7UoM.jpeg", 
        objects: [
            { name: 'seat', x: 310, y: 150, w: 80, h: 100, img: "" } 
        ],
        npcs: [],
        door: null,
        bounds: { minX: 50, maxX: 450, minY: 50, maxY: 450 }
    },
    suseo_parking: {
        bg: "https://i.imgur.com/uYcIJkq.jpeg", 
        objects: [
            { name: 'car', x: 215, y: 180, w: 55, h: 130, img: "" } 
        ],
        npcs: [
            { name: '형균', x: 170, y: 220, w: 40, h: 70 } 
        ],
        door: null,
        bounds: { minX: 20, maxX: 480, minY: 180, maxY: 480 }
    },
    car_inside: {
        bg: "https://i.imgur.com/OyvVFZN.jpeg", 
        objects: [
            { name: 'lunchbox', x: 280, y: 270, w: 80, h: 80, img: "" }
        ],
        npcs: [
            { name: '형균', x: 175, y: 280, w: 70, h: 80 }
        ],
        door: null,
        bounds: { minX: 10, maxX: 490, minY: 180, maxY: 450 }
    },
    restaurant: {
        bg: "https://via.placeholder.com/500x500.png?text=Restaurant+Scene", 
        objects: [],
        npcs: [],
        door: null,
        bounds: { minX: 50, maxX: 450, minY: 50, maxY: 450 }
    }
};

const playerImages = { front: new Image(), back: new Image(), left: new Image(), right: new Image() };
playerImages.front.src = "https://i.imgur.com/l1ENJqo.png";
playerImages.back.src = "https://i.imgur.com/nbzUAfX.png";
playerImages.left.src = "https://i.imgur.com/ginoxYa.png";
playerImages.right.src = "https://i.imgur.com/cQLW6ag.png";

const backgroundImg = new Image();
let player = { x: 250, y: 300, size: 55, step: 35, direction: "front", name: "지수" };

Object.values(mapData).forEach(map => {
    map.objects.forEach(obj => {
        if(obj.img) {
            obj.imgObj = new Image();
            obj.imgObj.src = obj.img;
        }
    });
});

function addText(text) {
    if(!text) return;
    const box = document.getElementById('textBox');
    const newMsg = document.createElement('div');
    newMsg.className = 'msg-entry';
    newMsg.style.marginBottom = "8px";
    box.appendChild(newMsg);

    let i = 0;
    const interval = setInterval(() => {
        if (i < text.length) {
            newMsg.innerHTML += text[i++];
            box.scrollTop = box.scrollHeight;
        } else {
            clearInterval(interval);
        }
    }, 25);
}

function loadMap(mapName) {
    if (!mapData[mapName]) return;
    currentMap = mapName;
    backgroundImg.src = mapData[mapName].bg;
    isTransitioning = false;
    document.getElementById('loadingOverlay').style.display = 'none';

    if(mapName === "station") { player.x = 80; player.y = 420; }
    else if(mapName === "room") { player.x = 100; player.y = 300; } // 시작 위치 조정
    else if(mapName === "srt_inside") { player.x = 250; player.y = 420; addText("열차 안에 들어왔어!"); setTimeout(() => addText(messages.hint_srt), 1000); }
    else if(mapName === "suseo_parking") { player.x = 100; player.y = 420; addText(messages.parking_msg); }
    else if(mapName === "car_inside") { player.x = 250; player.y = 400; addText(messages.car_inside_welcome); }
    else if(mapName === "restaurant") { player.x = 250; player.y = 400; addText("배고프다! 맛있는 거 먹으러 가자! 🍲"); }
}

function showLoadingBar(text, duration, targetMap) {
    const overlay = document.getElementById('loadingOverlay');
    const bar = document.getElementById('progressBar');
    const loadingText = document.getElementById('loadingText');
    loadingText.innerText = text;
    overlay.style.display = 'block';
    isTransitioning = true;
    let width = 0;
    const step = 100 / (duration / 100);
    const interval = setInterval(() => {
        if (width >= 100) { clearInterval(interval); loadMap(targetMap); }
        else { width += step; bar.style.width = width + '%'; }
    }, 100);
}

function handleInteraction(e) {
    if (isTransitioning) return; 

    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = (e.clientX || (e.touches && e.touches[0].clientX));
    const clientY = (e.clientY || (e.touches && e.touches[0].clientY));
    const clickX = (clientX - rect.left) * scaleX;
    const clickY = (clientY - rect.top) * scaleY;

    // 카 안에서 왼쪽 클릭 시 이동
    if (currentMap === "car_inside" && clickX < 60) {
        showLoadingBar("식당으로 이동 중...", 3000, "restaurant");
        return;
    }

    // NPC 클릭
    if (mapData[currentMap].npcs) {
        for (let npc of mapData[currentMap].npcs) {
            if (clickX > npc.x && clickX < npc.x + npc.w && clickY > npc.y && clickY < npc.y + npc.h) {
                if (currentMap === "car_inside" && npc.name === '형균') addText(messages.car_oppa);
                else if (npc.name === '형균') addText(messages.oppa_talk);
                return;
            }
        }
    }

    // 오브젝트 클릭
    let targetObj = null;
    mapData[currentMap].objects.forEach(obj => {
        if (clickX > obj.x && clickX < obj.x + obj.w && clickY > obj.y && clickY < obj.y + obj.h) targetObj = obj;
    });

    if (targetObj) {
        if (targetObj.name === "seat") {
            player.x = targetObj.x + targetObj.w / 2;
            player.y = targetObj.y + targetObj.h / 2;
            addText(messages.seat);
            showLoadingBar("수서역으로 가는 중...", 5000, "suseo_parking");
            return;
        }
        if (targetObj.name === "car") {
            addText(messages.car_msg);
            showLoadingBar("차에 타는 중...", 3000, "car_inside");
            return;
        }
        if (targetObj.name === "lunchbox") { addText(messages.car_lunchbox); return; }
        addText(messages[targetObj.name]);
    }

    // 캐릭터 이동 및 문 이동 체크
    const door = mapData[currentMap].door;
    if (door && clickX > door.x && clickX < door.x + door.w && clickY > door.y && clickY < door.y + door.h) {
        loadMap(door.target);
        return;
    }

    const diffX = clickX - player.x;
    const diffY = clickY - player.y;
    let nextX = player.x;
    let nextY = player.y;

    if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 0) { nextX += player.step; player.direction = "right"; }
        else { nextX -= player.step; player.direction = "left"; }
    } else {
        if (diffY > 0) { nextY += player.step; player.direction = "front"; }
        else { nextY -= player.step; player.direction = "back"; }
    }

    const bounds = mapData[currentMap].bounds;
    if (nextX >= bounds.minX && nextX <= bounds.maxX && 
        nextY >= bounds.minY && nextY <= bounds.maxY &&
        !checkCollision(nextX, nextY)) {
        player.x = nextX;
        player.y = nextY;
        
        // 오른쪽 끝 도달 시 자동 맵 전환 (방에서 정거장으로)
        if (currentMap === "room" && player.x > 450) {
            loadMap("station");
        }
    }
}

function checkCollision(nx, ny) {
    const objects = mapData[currentMap].objects;
    for (let obj of objects) {
        if (nx > obj.x - 10 && nx < obj.x + obj.w + 10 &&
            ny > obj.y - 10 && ny < obj.y + obj.h + 10) return true;
    }
    return false;
}

canvas.addEventListener('mousedown', handleInteraction);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleInteraction(e); }, {passive: false});

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (backgroundImg.complete) ctx.drawImage(backgroundImg, 0, 0, canvas.width, canvas.height);
    
    mapData[currentMap].objects.forEach(obj => {
        if (obj.imgObj && obj.imgObj.complete) ctx.drawImage(obj.imgObj, obj.x, obj.y, obj.w, obj.h);
    });

    if (mapData[currentMap].npcs) {
        mapData[currentMap].npcs.forEach(npc => {
            ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
            ctx.fillRect(npc.x + npc.w/2 - 25, npc.y - 25, 50, 18);
            ctx.fillStyle = "#ffeb3b";
            ctx.font = "14px 'DungGeunMo'";
            ctx.textAlign = "center";
            ctx.fillText(npc.name, npc.x + npc.w/2, npc.y - 11);
        });
    }

    const pImg = playerImages[player.direction];
    if (pImg.complete) ctx.drawImage(pImg, player.x - player.size / 2, player.y - player.size / 2, player.size, player.size);
    
    ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
    ctx.fillRect(player.x - 25, player.y - 45, 50, 18);
    ctx.fillStyle = "white";
    ctx.font = "14px 'DungGeunMo'";
    ctx.textAlign = "center";
    ctx.fillText(player.name, player.x, player.y - 31);

    requestAnimationFrame(draw);
}

window.onload = () => { loadMap("room"); addText(messages.welcome); draw(); };
</script>
</body>
</html>
