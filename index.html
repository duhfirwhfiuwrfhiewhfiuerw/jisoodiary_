<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍞 빵 영양성분 앱</title>
<style>

body{
margin:0;
font-family:'Pretendard',sans-serif;
background:linear-gradient(#ffd6e7,#ffeaf3);
color:#6b2c4a;
overflow-x:hidden;
}

.dark{
background:#1e1e1e;
color:white;
}

header{
text-align:center;
padding:20px;
font-size:30px;
font-weight:bold;
color:#ff4f93;
}

/* 상단 버튼 */

.topbar{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:15px;
}

button{
border:none;
padding:10px 16px;
border-radius:25px;
background:#ff9ec7;
color:white;
font-weight:bold;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

button:hover{
transform:scale(1.05);
}

/* 컨테이너 */

.container{
max-width:720px;
margin:auto;
padding:15px;
}

/* 카드 */

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

.card{
background:#fff0f6;
padding:14px;
border-radius:20px;
text-align:center;
cursor:pointer;
box-shadow:0 6px 14px rgba(0,0,0,0.1);
transition:0.2s;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:120px;
object-fit:cover;
border-radius:14px;
margin-bottom:8px;
}

/* 검색 */

.search{
width:100%;
padding:12px;
border-radius:20px;
border:none;
margin-bottom:14px;
box-shadow:0 3px 8px rgba(0,0,0,0.1);
}

/* 상세 */

.detail{
background:#fff0f6;
padding:20px;
border-radius:20px;
box-shadow:0 6px 14px rgba(0,0,0,0.1);
}

/* 뒤로 */

.back{
background:#ff7fb4;
margin-bottom:15px;
}

/* 곰 애니메이션 */

.bear{
position:fixed;
top:-50px;
font-size:30px;
animation:fall linear infinite;
opacity:0.6;
}

@keyframes fall{
0%{transform:translateY(-50px)}
100%{transform:translateY(110vh)}
}

/* 숨김 iframe */

.music{
display:none;
}

</style>
</head>
<body>
<header>🩷 빵 영양성분 사전</header>
<div class="topbar">
<button onclick="toggleDark()">🌙 다크모드</button>
<button onclick="playMusic()">🎵 브금</button>
</div>
<iframe class="music" id="music"
src="https://www.youtube.com/embed/4xDzrJKXOOY?autoplay=1&loop=1"
allow="autoplay">
</iframe>
<div class="container" id="app"></div>
<script>

/* 곰 비 생성 */

for(let i=0;i<15;i++){
const bear=document.createElement("div");
bear.className="bear";
bear.innerText="🧸";
bear.style.left=Math.random()*100+"%";
bear.style.animationDuration=(5+Math.random()*10)+"s";
document.body.appendChild(bear);
}

/* 데이터 */

const bakeries={

"파리바게뜨":{

"페스츄리":[
{
name:"프렌치 크라상",
img:"https://images.unsplash.com/photo-1555507036-ab794f57584a?w=600",
amount:"70g",
kcal:"240kcal",
sodium:"230mg",
sugar:"6g",
fat:"8g",
protein:"5g",
allergy:"밀, 우유, 계란"
}
],

"간식빵":[
{
name:"소보로빵",
img:"https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=600",
amount:"85g",
kcal:"310kcal",
sodium:"280mg",
sugar:"12g",
fat:"10g",
protein:"6g",
allergy:"밀, 우유, 계란"
}
]

},

"뚜레쥬르":{

"도넛":[
{
name:"슈가도넛",
img:"https://images.unsplash.com/photo-1551024601-bec78aea704b?w=600",
amount:"75g",
kcal:"320kcal",
sodium:"250mg",
sugar:"15g",
fat:"12g",
protein:"5g",
allergy:"밀, 우유, 계란"
}
]

}

};

let currentBakery=null;
let currentCategory=null;

/* 빵집 */

function showBakeries(){

const app=document.getElementById("app");
app.innerHTML="";

Object.keys(bakeries).forEach(b=>{

const div=document.createElement("div");
div.className="card";
div.innerHTML=`<h3>${b}</h3>`;
div.onclick=()=>showCategories(b);

app.appendChild(div);

});

}

/* 카테고리 */

function showCategories(b){

currentBakery=b;

const app=document.getElementById("app");

app.innerHTML=`<button class="back" onclick="showBakeries()">⬅ 뒤로</button>
<div class="grid" id="cat"></div>`;

const cat=document.getElementById("cat");

Object.keys(bakeries[b]).forEach(c=>{

const div=document.createElement("div");
div.className="card";
div.innerHTML=`<h3>${c}</h3>`;
div.onclick=()=>showBreads(c);

cat.appendChild(div);

});

}

/* 빵목록 */

function showBreads(c){

currentCategory=c;

const app=document.getElementById("app");

app.innerHTML=`
<button class="back" onclick="showCategories('${currentBakery}')">⬅ 뒤로</button>
<input class="search" placeholder="빵 검색" oninput="searchBread(this.value)">
<div class="grid" id="breadList"></div>
`;

renderBreadList(bakeries[currentBakery][c]);

}

function renderBreadList(list){

const breadList=document.getElementById("breadList");
breadList.innerHTML="";

list.forEach(b=>{

const div=document.createElement("div");
div.className="card";

div.innerHTML=`
<img src="${b.img}">
<b>${b.name}</b>
`;

div.onclick=()=>showDetail(b);

breadList.appendChild(div);

});

}

/* 검색 */

function searchBread(text){

const list=bakeries[currentBakery][currentCategory]
.filter(b=>b.name.includes(text));

renderBreadList(list);

}

/* 상세 */

function showDetail(b){

const app=document.getElementById("app");

app.innerHTML=`
<button class="back" onclick="showBreads('${currentCategory}')">⬅ 뒤로</button>

<div class="detail">

<h2>${b.name}</h2>

<p>내용량 : ${b.amount}</p>
<p>칼로리 : ${b.kcal}</p>
<p>나트륨 : ${b.sodium}</p>
<p>당류 : ${b.sugar}</p>
<p>포화지방 : ${b.fat}</p>
<p>단백질 : ${b.protein}</p>
<p>알레르기 : ${b.allergy}</p>

</div>
`;

}

/* 다크모드 */

function toggleDark(){
document.body.classList.toggle("dark");
}

/* 브금 */

function playMusic(){
document.getElementById("music").src+="&mute=0";
}

showBakeries();

</script>
</body>
</html>
