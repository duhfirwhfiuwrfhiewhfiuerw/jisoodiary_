<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍞 빵 영양성분 사전</title>
<style>

body{
margin:0;
font-family:'Pretendard',sans-serif;
background:linear-gradient(#fff6e9,#f3e2c7);
color:#3a2b1c;
transition:0.3s;
}

.dark{
background:#1e1e1e;
color:white;
}

header{
text-align:center;
padding:20px;
font-size:28px;
font-weight:bold;
}

.topbar{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:10px;
}

button{
border:none;
border-radius:20px;
padding:8px 14px;
background:#ffb347;
cursor:pointer;
font-weight:600;
}

button:hover{
opacity:0.8;
}

.container{
max-width:720px;
margin:auto;
padding:15px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.card{
background:white;
border-radius:16px;
padding:14px;
box-shadow:0 6px 14px rgba(0,0,0,0.1);
cursor:pointer;
transition:0.2s;
text-align:center;
}

.card:hover{
transform:translateY(-4px);
}

.card img{
width:100%;
height:120px;
object-fit:cover;
border-radius:12px;
margin-bottom:8px;
}

.dark .card{
background:#2b2b2b;
}

.search{
width:100%;
padding:10px;
border-radius:12px;
border:1px solid #ddd;
margin-bottom:14px;
}

.detail{
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 6px 14px rgba(0,0,0,0.1);
}

.dark .detail{
background:#2b2b2b;
}

.back{
margin-bottom:14px;
background:#ff9966;
}

.musicFrame{
display:none;
}

</style>
</head>
<body>
<header>🍞 빵 영양성분 사전</header>
<div class="topbar">
<button onclick="toggleDark()">🌙 다크모드</button>
<button onclick="toggleMusic()">🎵 브금</button>
</div>
<iframe class="musicFrame" id="music"
src="https://www.youtube.com/embed/4xDzrJKXOOY?autoplay=1&loop=1"
allow="autoplay">
</iframe>
<div class="container" id="app"></div>
<script>

const bakeries={

"파리바게뜨":{

"식빵":[
{
name:"우유식빵",
img:"https://images.unsplash.com/photo-1608198093002-ad4e005484ec?w=600",
amount:"100g",
kcal:"210kcal",
sodium:"260mg",
sugar:"7g",
fat:"3g",
protein:"7g",
allergy:"밀, 우유"
}
],

"간식빵":[
{
name:"소보로빵",
img:"https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=600",
amount:"85g",
kcal:"310kcal",
sodium:"280mg",
sugar:"12g",
fat:"10g",
protein:"6g",
allergy:"밀, 우유, 계란"
}
],

"건강빵":[
{
name:"호밀빵",
img:"https://images.unsplash.com/photo-1549931319-a545dcf3bc73?w=600",
amount:"90g",
kcal:"190kcal",
sodium:"200mg",
sugar:"3g",
fat:"2g",
protein:"6g",
allergy:"밀"
}
],

"도넛":[
{
name:"슈가도넛",
img:"https://images.unsplash.com/photo-1551024601-bec78aea704b?w=600",
amount:"75g",
kcal:"320kcal",
sodium:"250mg",
sugar:"15g",
fat:"12g",
protein:"5g",
allergy:"밀, 우유, 계란"
}
],

"페스츄리":[
{
name:"프렌치 크라상",
img:"https://images.unsplash.com/photo-1555507036-ab794f57584a?w=600",
amount:"70g",
kcal:"240kcal",
sodium:"230mg",
sugar:"6g",
fat:"8g",
protein:"5g",
allergy:"밀, 우유, 계란"
}
]

},

"뚜레쥬르":{

"식빵":[
{
name:"우유식빵",
img:"https://images.unsplash.com/photo-1608198093002-ad4e005484ec?w=600",
amount:"100g",
kcal:"210kcal",
sodium:"250mg",
sugar:"7g",
fat:"3g",
protein:"7g",
allergy:"밀, 우유"
}
],

"간식빵":[
{
name:"단팥빵",
img:"https://images.unsplash.com/photo-1599785209707-a456fc1337bb?w=600",
amount:"90g",
kcal:"300kcal",
sodium:"270mg",
sugar:"13g",
fat:"8g",
protein:"6g",
allergy:"밀, 우유"
}
]

}

};

let currentBakery=null;
let currentCategory=null;

function showBakeries(){

const app=document.getElementById("app");
app.innerHTML="";

Object.keys(bakeries).forEach(b=>{

const div=document.createElement("div");
div.className="card";

div.innerHTML=`<h3>${b}</h3>`;

div.onclick=()=>showCategories(b);

app.appendChild(div);

});

}

function showCategories(b){

currentBakery=b;

const app=document.getElementById("app");

app.innerHTML=`<button class="back" onclick="showBakeries()">⬅ 뒤로</button>
<div class="grid" id="cat"></div>`;

const cat=document.getElementById("cat");

Object.keys(bakeries[b]).forEach(c=>{

const div=document.createElement("div");
div.className="card";
div.innerHTML=`<h3>${c}</h3>`;
div.onclick=()=>showBreads(c);

cat.appendChild(div);

});

}

function showBreads(c){

currentCategory=c;

const app=document.getElementById("app");

app.innerHTML=`
<button class="back" onclick="showCategories('${currentBakery}')">⬅ 뒤로</button>
<input class="search" placeholder="빵 검색" oninput="searchBread(this.value)">
<div class="grid" id="breadList"></div>
`;

renderBreadList(bakeries[currentBakery][c]);

}

function renderBreadList(list){

const breadList=document.getElementById("breadList");
breadList.innerHTML="";

list.forEach(b=>{

const div=document.createElement("div");
div.className="card";

div.innerHTML=`
<img src="${b.img}">
<b>${b.name}</b>
`;

div.onclick=()=>showDetail(b);

breadList.appendChild(div);

});

}

function searchBread(text){

const list=bakeries[currentBakery][currentCategory]
.filter(b=>b.name.includes(text));

renderBreadList(list);

}

function showDetail(b){

const app=document.getElementById("app");

app.innerHTML=`
<button class="back" onclick="showBreads('${currentCategory}')">⬅ 뒤로</button>

<div class="detail">

<h2>${b.name}</h2>

<p><b>내용량</b> : ${b.amount}</p>
<p><b>칼로리</b> : ${b.kcal}</p>
<p><b>나트륨</b> : ${b.sodium}</p>
<p><b>당류</b> : ${b.sugar}</p>
<p><b>포화지방</b> : ${b.fat}</p>
<p><b>단백질</b> : ${b.protein}</p>
<p><b>알레르기</b> : ${b.allergy}</p>

</div>
`;

}

function toggleDark(){
document.body.classList.toggle("dark");
}

let musicOn=false;

function toggleMusic(){

const music=document.getElementById("music");

musicOn=!musicOn;

music.style.display=musicOn?"block":"none";

}

showBakeries();

</script>
</body>
</html>
