<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🩷 빵 영양성분 앱</title>
<style>

body{
margin:0;
font-family:'Pretendard',sans-serif;
background:linear-gradient(#ffd6ea,#ffeaf5);
color:#5b2c4a;
overflow-x:hidden;
transition:0.4s;
}

body.dark{
background:linear-gradient(#2b1b2a,#1a1118);
color:#ffd3e6;
}

/* 헤더 */

header{
text-align:center;
padding:20px;
font-size:30px;
font-weight:bold;
color:#ff4fa0;
}

/* 상단바 */

.topbar{
display:flex;
justify-content:center;
gap:12px;
margin-bottom:15px;
}

/* 3D 버튼 */

button{
border:none;
padding:10px 18px;
border-radius:25px;
background:#ff8fc2;
color:white;
font-weight:bold;
cursor:pointer;
box-shadow:0 6px 0 #d45a90, 0 8px 15px rgba(0,0,0,0.2);
transition:0.1s;
}

button:active{
transform:translateY(4px);
box-shadow:0 2px 0 #d45a90;
}

body.dark button{
background:#ff6fae;
box-shadow:0 6px 0 #b84b82;
}

/* 컨테이너 */

.container{
max-width:720px;
margin:auto;
padding:15px;
}

/* 카드 */

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

.card{
background:#fff0f7;
padding:14px;
border-radius:20px;
text-align:center;
cursor:pointer;
box-shadow:0 6px 14px rgba(0,0,0,0.12);
transition:0.2s;
}

body.dark .card{
background:#3a2435;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:120px;
object-fit:cover;
border-radius:14px;
margin-bottom:8px;
}

/* 검색 */

.search{
width:100%;
padding:12px;
border-radius:20px;
border:none;
margin-bottom:14px;
box-shadow:0 3px 8px rgba(0,0,0,0.1);
}

/* 상세 */

.detail{
background:#fff0f7;
padding:20px;
border-radius:20px;
box-shadow:0 6px 14px rgba(0,0,0,0.1);
}

body.dark .detail{
background:#3a2435;
}

/* 뒤로 */

.back{
background:#ff7fb7;
margin-bottom:15px;
}

/* 곰 + 하트 애니메이션 */

.fall{
position:fixed;
top:-50px;
font-size:28px;
animation:fall linear infinite;
opacity:0.7;
}

@keyframes fall{
0%{
transform:translateY(-50px) rotate(0deg);
}
100%{
transform:translateY(110vh) rotate(360deg);
}
}

/* 음악 iframe 숨김 */

.musicFrame{
display:none;
}

</style>
</head>
<body>
<header>🩷 빵 영양성분 사전</header>
<div class="topbar">
<button onclick="toggleDark()">🌙 다크모드</button>
<button onclick="toggleMusic()">🎵 브금 OFF</button>
</div>
<iframe id="music" class="musicFrame"
src=""
allow="autoplay">
</iframe>
<div class="container" id="app"></div>
<script>

/* 곰 + 하트 생성 */

const emojis=["🧸","💗"];

for(let i=0;i<20;i++){

const el=document.createElement("div");

el.className="fall";

el.innerText=emojis[Math.floor(Math.random()*emojis.length)];

el.style.left=Math.random()*100+"%";

el.style.animationDuration=(6+Math.random()*10)+"s";

document.body.appendChild(el);

}

/* 데이터 */

const bakeries={

"파리바게뜨":{

"페스츄리":[
{
name:"프렌치 크라상",
img:"https://images.unsplash.com/photo-1555507036-ab794f57584a?w=600",
amount:"70g",
kcal:"240kcal",
sodium:"230mg",
sugar:"6g",
fat:"8g",
protein:"5g",
allergy:"밀, 우유, 계란"
}
],

"간식빵":[
{
name:"소보로빵",
img:"https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=600",
amount:"85g",
kcal:"310kcal",
sodium:"280mg",
sugar:"12g",
fat:"10g",
protein:"6g",
allergy:"밀, 우유, 계란"
}
]

},

"뚜레쥬르":{

"도넛":[
{
name:"슈가도넛",
img:"https://images.unsplash.com/photo-1551024601-bec78aea704b?w=600",
amount:"75g",
kcal:"320kcal",
sodium:"250mg",
sugar:"15g",
fat:"12g",
protein:"5g",
allergy:"밀, 우유, 계란"
}
]

}

};

let currentBakery=null;
let currentCategory=null;

/* 빵집 */

function showBakeries(){

const app=document.getElementById("app");
app.innerHTML="";

Object.keys(bakeries).forEach(b=>{

const div=document.createElement("div");

div.className="card";

div.innerHTML=`<h3>${b}</h3>`;

div.onclick=()=>showCategories(b);

app.appendChild(div);

});

}

/* 카테고리 */

function showCategories(b){

currentBakery=b;

const app=document.getElementById("app");

app.innerHTML=`<button class="back" onclick="showBakeries()">⬅ 뒤로</button>
<div class="grid" id="cat"></div>`;

const cat=document.getElementById("cat");

Object.keys(bakeries[b]).forEach(c=>{

const div=document.createElement("div");

div.className="card";

div.innerHTML=`<h3>${c}</h3>`;

div.onclick=()=>showBreads(c);

cat.appendChild(div);

});

}

/* 빵 목록 */

function showBreads(c){

currentCategory=c;

const app=document.getElementById("app");

app.innerHTML=`
<button class="back" onclick="showCategories('${currentBakery}')">⬅ 뒤로</button>
<input class="search" placeholder="빵 검색" oninput="searchBread(this.value)">
<div class="grid" id="breadList"></div>
`;

renderBreadList(bakeries[currentBakery][c]);

}

function renderBreadList(list){

const breadList=document.getElementById("breadList");

breadList.innerHTML="";

list.forEach(b=>{

const div=document.createElement("div");

div.className="card";

div.innerHTML=`
<img src="${b.img}">
<b>${b.name}</b>
`;

div.onclick=()=>showDetail(b);

breadList.appendChild(div);

});

}

/* 검색 */

function searchBread(text){

const list=bakeries[currentBakery][currentCategory]
.filter(b=>b.name.includes(text));

renderBreadList(list);

}

/* 상세 */

function showDetail(b){

const app=document.getElementById("app");

app.innerHTML=`
<button class="back" onclick="showBreads('${currentCategory}')">⬅ 뒤로</button>

<div class="detail">

<h2>${b.name}</h2>

<p>내용량 : ${b.amount}</p>
<p>칼로리 : ${b.kcal}</p>
<p>나트륨 : ${b.sodium}</p>
<p>당류 : ${b.sugar}</p>
<p>포화지방 : ${b.fat}</p>
<p>단백질 : ${b.protein}</p>
<p>알레르기 : ${b.allergy}</p>

</div>
`;

}

/* 다크모드 */

function toggleDark(){

document.body.classList.toggle("dark");

}

/* 브금 */

let musicOn=false;

function toggleMusic(){

const music=document.getElementById("music");
const btn=document.querySelector(".topbar button:nth-child(2)");

if(!musicOn){

music.src="https://www.youtube.com/embed/4xDzrJKXOOY?autoplay=1&loop=1";
btn.innerText="🎵 브금 ON";

}else{

music.src="";
btn.innerText="🎵 브금 OFF";

}

musicOn=!musicOn;

}

showBakeries();

</script>
</body>
</html>
